
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
  - task: UseDotNet@2
    displayName: .NET 10 SDK
    inputs:
      packageType: sdk
      version: '10.0.x'

  # The rules that decide what a couple is charged. A red test stops the deploy.
  - task: DotNetCoreCLI@2
    displayName: Domain tests
    inputs:
      command: test
      projects: tests/WeddingBooking.Domain.Tests/WeddingBooking.Domain.Tests.csproj
      arguments: '--configuration $(buildConfiguration)'

  # publishWebProjects defaults to true and would pick up every project in the
  # solution. This repo has four, plus two test projects; naming the API
  # explicitly is what stops the wrong one being deployed.
  - task: DotNetCoreCLI@2
    displayName: Publish the API
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/WeddingBooking.Api/WeddingBooking.Api.csproj
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
      zipAfterPublish: true

  - task: AzureWebApp@1
    displayName: Deploy to App Service
    inputs:
      azureSubscription: $(azureServiceConnection)
      appType: webAppLinux
      appName: $(webAppName)
      package: $(Build.ArtifactStagingDirectory)/**/*.zip
